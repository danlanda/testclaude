<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Planner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <h1>Travel Planner</h1>
        </div>
        <div class="auth-section">
          <button id="signInBtn" class="btn btn-primary hidden">Sign In</button>
          <div id="userInfo" class="user-info hidden">
            <img id="userAvatar" src="" alt="User" class="avatar">
            <span id="userName"></span>
            <button id="signOutBtn" class="btn btn-small">Sign Out</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Auth Required Message -->
    <div id="authRequired" class="auth-required hidden">
      <div class="auth-message">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <h2>Sign in to save your places</h2>
        <p>Connect with Google to sync your travel plans across devices</p>
        <button id="signInBtnMain" class="btn btn-primary btn-large">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Sign in with Google
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <main id="mainContent" class="main-content hidden">
      <!-- Tab Navigation -->
      <nav class="tabs">
        <button class="tab active" data-tab="list">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          List
        </button>
        <button class="tab" data-tab="map">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
            <line x1="8" y1="2" x2="8" y2="18"></line>
            <line x1="16" y1="6" x2="16" y2="22"></line>
          </svg>
          Map
        </button>
      </nav>

      <!-- Filters -->
      <div class="filters">
        <div class="filter-group">
          <label>Category</label>
          <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="accommodation">Accommodation</option>
            <option value="activities">Activities</option>
            <option value="food">Food & Dining</option>
            <option value="transportation">Transportation</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Location</label>
          <input type="text" id="locationFilter" placeholder="Filter by location...">
        </div>
        <button id="scanPageBtn" class="btn btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          Scan Page
        </button>
      </div>

      <!-- List View -->
      <div id="listView" class="tab-content active">
        <div id="placesList" class="places-list">
          <!-- Places will be rendered here -->
        </div>
        <div id="emptyState" class="empty-state hidden">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <h3>No places yet</h3>
          <p>Scan a travel page to start building your trip!</p>
        </div>
      </div>

      <!-- Map View -->
      <div id="mapView" class="tab-content hidden">
        <div id="map" class="map-container"></div>
      </div>
    </main>

    <!-- Add Place Modal -->
    <div id="addPlaceModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add Place</h2>
          <button id="closeModalBtn" class="btn-close">&times;</button>
        </div>
        <form id="addPlaceForm">
          <div class="form-group">
            <label for="placeName">Name</label>
            <input type="text" id="placeName" required>
          </div>
          <div class="form-group">
            <label for="placeDescription">Description</label>
            <textarea id="placeDescription" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="placeCategory">Category</label>
            <select id="placeCategory" required>
              <option value="accommodation">Accommodation</option>
              <option value="activities">Activities</option>
              <option value="food">Food & Dining</option>
              <option value="transportation">Transportation</option>
            </select>
          </div>
          <div class="form-group">
            <label for="placeLocation">Location</label>
            <input type="text" id="placeLocation">
          </div>
          <div class="form-group">
            <label for="placeBookingLink">Booking Link</label>
            <input type="url" id="placeBookingLink">
          </div>
          <div class="form-actions">
            <button type="button" id="cancelAddBtn" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary">Add Place</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Floating Add Button -->
    <button id="addPlaceBtn" class="fab hidden">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

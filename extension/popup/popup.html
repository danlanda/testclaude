<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>
        <svg class="header-logo" viewBox="0 0 200 200" width="28" height="28">
          <circle cx="100" cy="100" r="96" fill="#2c2c2c"/>
          <circle cx="100" cy="100" r="87" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.5"/>
          <g fill="rgba(255,255,255,0.9)"><polygon points="100,38 136,98 64,98"/><polygon points="68,56 40,98 96,98"/><polygon points="132,53 160,98 104,98"/></g>
          <g fill="#2c2c2c"><polygon points="100,38 108,50 92,50"/><polygon points="132,53 138,62 126,62"/></g>
        </svg>
        Page Summary
      </h1>
      <div id="authSection" class="auth-section">
        <button id="signInBtn" class="btn-auth">Sign In</button>
        <div id="userInfo" class="user-info hidden">
          <span id="userName"></span>
          <button id="signOutBtn" class="btn-auth-small">Sign Out</button>
        </div>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="summarize">Summarize</button>
      <button class="tab" data-tab="dashboard">My Summaries</button>
    </nav>

    <!-- Summarize Tab -->
    <main id="summarizeTab" class="tab-content active">
      <div class="page-info">
        <div id="pageTitle" class="page-title">Loading...</div>
        <div id="pageUrl" class="page-url"></div>
      </div>

      <button id="summarizeBtn" class="btn btn-primary">
        ✨ Summarize This Page
      </button>

      <div id="resultSection" class="result-section hidden">
        <div id="statsSection" class="stats-section">
          <div class="stats-grid">
            <div class="stat">
              <span class="stat-value" id="wordCount">0</span>
              <span class="stat-label">Words</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="linkCount">0</span>
              <span class="stat-label">Links</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="imageCount">0</span>
              <span class="stat-label">Images</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="headingCount">0</span>
              <span class="stat-label">Headings</span>
            </div>
          </div>
        </div>

        <div class="summary-section">
          <h3>Summary</h3>
          <div id="summaryContent" class="summary-content"></div>
        </div>

        <div id="keyPointsSection" class="key-points-section hidden">
          <h3>Key Points</h3>
          <ul id="keyPointsList" class="key-points-list"></ul>
        </div>

        <button id="saveBtn" class="btn btn-secondary hidden">
          💾 Save to Dashboard
        </button>
        <div id="savedMessage" class="saved-message hidden">✓ Saved!</div>
      </div>
    </main>

    <!-- Dashboard Tab -->
    <main id="dashboardTab" class="tab-content hidden">
      <div id="loginPrompt" class="login-prompt">
        <p>Sign in to view your saved summaries</p>
        <button id="signInBtn2" class="btn btn-primary">Sign In with Google</button>
      </div>

      <div id="summariesList" class="summaries-list hidden">
        <!-- Saved summaries will be rendered here -->
      </div>

      <div id="emptyDashboard" class="empty-state hidden">
        <p>No saved summaries yet</p>
        <p class="hint">Summarize a page and click "Save to Dashboard"</p>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Summary</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>📄 Page Summary</h1>
    </header>

    <main class="main-content">
      <div id="pageInfo" class="page-info">
        <div id="pageTitle" class="page-title">Loading...</div>
        <div id="pageUrl" class="page-url"></div>
      </div>

      <button id="summarizeBtn" class="btn btn-primary">
        ✨ Summarize This Page
      </button>

      <div id="summarySection" class="summary-section hidden">
        <h2>Summary</h2>
        <div id="summaryContent" class="summary-content"></div>
      </div>

      <div id="statsSection" class="stats-section hidden">
        <h2>Page Stats</h2>
        <div class="stats-grid">
          <div class="stat">
            <span class="stat-value" id="wordCount">0</span>
            <span class="stat-label">Words</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="linkCount">0</span>
            <span class="stat-label">Links</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="imageCount">0</span>
            <span class="stat-label">Images</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="headingCount">0</span>
            <span class="stat-label">Headings</span>
          </div>
        </div>
      </div>

      <div id="keyPointsSection" class="key-points-section hidden">
        <h2>Key Points</h2>
        <ul id="keyPointsList" class="key-points-list"></ul>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 200 200">
  <defs>
    <path id="topArc" d="M 34,98 A 66,66 0 0 1 166,98"/>
    <path id="bottomArc" d="M 44,110 A 56,56 0 0 0 156,110"/>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="96" fill="#2c2c2c"/>
  <!-- Inner rings -->
  <circle cx="100" cy="100" r="87" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="83" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.5"/>

  <!-- Mountains -->
  <g fill="rgba(255,255,255,0.9)">
    <polygon points="100,38 136,98 64,98"/>
    <polygon points="68,56 40,98 96,98"/>
    <polygon points="132,53 160,98 104,98"/>
  </g>

  <!-- Snow caps -->
  <g fill="#2c2c2c">
    <polygon points="100,38 108,50 92,50"/>
    <polygon points="132,53 138,62 126,62"/>
  </g>

  <!-- Curved text -->
  <text fill="rgba(255,255,255,0.9)" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="7">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ICELAND</textPath>
  </text>
  <text fill="rgba(255,255,255,0.65)" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" letter-spacing="4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">TRIP PLANNER</textPath>
  </text>

  <!-- Decorative dots -->
  <circle cx="42" cy="100" r="2.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="158" cy="100" r="2.5" fill="rgba(255,255,255,0.6)"/>
</svg>
